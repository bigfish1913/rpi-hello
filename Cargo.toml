[package]
name = "rpi-hello"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Minimal rpi extension: a hello tool and a /hello command"
repository = "https://github.com/bigfish1913/rpi-hello"
readme = "README.md"
keywords = ["rpi", "extension", "plugin"]
categories = ["development-tools"]

[package.metadata.rpi.prebuilt]
supported-targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = "0.27"
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
