name: rpi-hello checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: fmt / test / clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check -p rpi-hello
      - name: Test
        run: cargo test --locked -p rpi-hello
      - name: Clippy
        run: cargo clippy --locked -p rpi-hello --all-targets --no-deps -- -D warnings

  manifest:
    name: distribution manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Root manifest matches the crate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          manifest = json.loads(pathlib.Path("rpi-extension.json").read_text())
          cargo = pathlib.Path("Cargo.toml").read_text()
          version = re.search(r'^version = "([^"]+)"', cargo, re.M).group(1)
          assert manifest["schemaVersion"] == 1
          assert manifest["name"] == "rpi-hello"
          assert manifest["version"] == version, (manifest["version"], version)
          assert manifest["type"] == "extension"
          assert manifest["install"].startswith("rpi install rpi-hello ")
          assert len(manifest["targets"]) == 6
          print("manifest ok")
          PY

  host-smoke:
    name: host loads the extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the rpi host
        run: curl -fsSL https://raw.githubusercontent.com/bigfish1913/pi-rust/main/scripts/install.sh | sh
      - name: Put rpi on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install this extension from the checkout
        run: rpi install --path . --force
      - name: Assert the tool is registered
        run: |
          set -euo pipefail
          rpi --no-session --offline --no-skills --debug-system-prompt -p x > smoke.txt 2>&1
          grep -q '^- hello — Greet a person by name' smoke.txt
          echo "host loaded the hello tool"
